              if (!authInstance) return;

                          name: firebaseUser.displayName || firebaseUser.email.split('@')[0],

                  } else {
                      setUser(null);
                  }
              });
              
              authInstance.getRedirectResult().catch((error) => {
                  if(error.code === 'auth/unauthorized-domain') {
                      setAuthError("Error: Debes autorizar tu dominio de GitHub Pages en la consola de Firebase.");
                  } else {
                      setAuthError("No se pudo iniciar sesión con Google.");
                  }
                  setShowAuthModal(true);
              });

              return () => unsubscribe();
          }, []);

          const handleAuthSubmit = async (e) => {
              e.preventDefault();
              setAuthError("");
              if(!authInstance) { setAuthError("Conexión con base de datos no disponible."); return; }
              const email = e.target.email.value;
              const password = e.target.password.value;
              try {
                  if (authMode === 'register') {
                      const userCredential = await authInstance.createUserWithEmailAndPassword(email, password);
                      const name = e.target.name.value;
                      if(name && userCredential.user) {
                          await userCredential.user.updateProfile({ displayName: name });

                  let msg = "Error de autenticación.";
                  if(error.code === 'auth/email-already-in-use') msg = "El correo ya está registrado.";
                  if(error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = "Contraseña o correo incorrecto.";
                  if(error.code === 'auth/user-not-found') msg = "Usuario no encontrado.";
                  if(error.code === 'auth/weak-password') msg = "La contraseña debe tener al menos 6 caracteres.";
                  setAuthError(msg);
              }
          };

          const handleGoogleLogin = () => {
              setAuthError("");
              if(!authInstance) return;
              const provider = new window.firebase.auth.GoogleAuthProvider();
              authInstance.signInWithRedirect(provider);

                      await authInstance.sendPasswordResetEmail(email);

          const lastMessageId = useRef(null);

          useEffect(() => {
              if (!dbInstance) return;
              const chatRef = dbInstance.ref('chat_cabina').limitToLast(50);
              const listener = chatRef.on('value', (snapshot) => {
                  const data = snapshot.val();
                  if (data) {
                      const loadedMessages = Object.keys(data).map(key => ({
                          id: key,
                          ...data[key]
                      }));
                      setMessages(loadedMessages);
                      
                      // Disparar Notificación Local de Chat
                      if (!isInitialChatLoad.current && loadedMessages.length > 0) {
                          const lastMsg = loadedMessages[loadedMessages.length - 1];

                                      icon: './logo.jpg'

                           if(loadedMessages.length > 0) lastMessageId.current = loadedMessages[loadedMessages.length - 1].id;

                      }

                      setMessages([{ id: 'welcome', user: 'Pregón 95.7', text: '¡Bienvenidos al chat en vivo de Mucutuy!', time: '' }]);

                  setShowAuthModal(true);

                  photo: user.photo,
                  text: chatMessage,
                  timestamp: window.firebase.database.ServerValue.TIMESTAMP,
                  time: new Date().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' })

              try {
                  // Conexión real con Gemini 3.8 Flash v1beta usando API KEY fija
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          system_instruction: {
                              parts: [{ text: "Eres Pregón, el asistente virtual y locutor de IA de la radio comunitaria Pregón 95.7 FM ubicada en Mucutuy, Mérida, Venezuela. Responde de forma carismática, alegre, breve y muy venezolana (andina). Ayudas a los usuarios con información de la radio, deportes y saludos." }]
                          },
                          contents: [{
                              role: "user",
                              parts: [{ text: currentInput }]
                          }]
                      })
                  });
                  
                  const data = await response.json();
                  setIsAITyping(false);
                  
                  if (data.candidates && data.candidates[0].content.parts[0].text) {
                      setAiMessages(prev => [...prev, { 
                          id: Date.now() + 1, 
                          text: data.candidates[0].content.parts[0].text, 
                          isUser: false 
                      }]);
                  } else {
                      throw new Error(data.error?.message || "Sin respuesta");
                  }
              } catch (error) {
                  setIsAITyping(false);
                  setAiMessages(prev => [...prev, { 
                      id: Date.now() + 1, 
                      text: "Oye compadre, hubo un problemita conectando con mi cerebro. Revisa tu conexión a internet.", 
                      isUser: false 
                  }]);
              }
          };

          // ================== REPRODUCTOR DE TV ==================
          useEffect(() => {
            if (viewMode === 'tv' && tvVideoRef.current) {
              setTvError(false);
              const video = tvVideoRef.current;
              let hls;
              const currentChannel = TV_CHANNELS.find(c => c.id === activeTvChannel);
              const currentTvUrl = currentChannel.url;

              const initPlayer = () => {
                if (window.Hls && window.Hls.isSupported()) {
                  hls = new window.Hls();
                  hls.loadSource(currentTvUrl);
                  hls.attachMedia(video);
                  hls.on(window.Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) { setTvError(true); hls.destroy(); }
                  });
                  hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => console.log("Autoplay block"));
                  });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                  video.src = currentTvUrl;
                  video.onerror = () => setTvError(true);
                  video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => console.log("Autoplay block"));
                  });
                }
              };

              if (window.Hls) initPlayer();
              else setTimeout(initPlayer, 500);

              return () => { if (hls) hls.destroy(); };
            }
          }, [viewMode, activeTvChannel]);

          const togglePiP = async () => {
              const video = tvVideoRef.current;
              if (video && document.pictureInPictureEnabled) {
                  try {
                      if (document.pictureInPictureElement) await document.exitPictureInPicture();
                      else await video.requestPictureInPicture();
                  } catch (error) {}
              }
          };

          const toggleFullScreen = () => {
              const video = tvVideoRef.current;
              if (video) {
                  if (video.requestFullscreen) video.requestFullscreen();
                  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
              }
          };

          // ================== FETCH DEPORTES Y NOTIFICACIÓN ==================
          const sportsNotified = useRef(false);
          useEffect(() => {
            if (viewMode === 'sports' && matches.length === 0) {
              const fetchSports = async () => {
                setLoadingSports(true);
                try {
                  const formatMatches = (events, leagueName) => events.map(ev => {
                      const comp = ev.competitions[0];
                      const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
                      const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
                      return {
                          id: ev.id, phase: leagueName || comp.notes?.[0]?.headline || "Fase Regular",
                          home: { name: homeTeam.team.shortDisplayName || homeTeam.team.name, score: homeTeam.score, logo: homeTeam.team.logo || 'https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-500.png' },
                          away: { name: awayTeam.team.shortDisplayName || awayTeam.team.name, score: awayTeam.score, logo: awayTeam.team.logo || 'https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-500.png' },
                          status: ev.status.type.state, detail: ev.status.type.shortDetail, date: ev.date
                      };
                  });
                  const leagues = ['esp.1', 'uefa.champions', 'eng.1', 'conmebol.libertadores', 'ven.1'];
                  const fetchPromises = leagues.map(league =>
                      fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard`).then(res => res.json()).catch(() => ({}))
                  );
                  const results = await Promise.all(fetchPromises);
                  let allMatches = [];
                  results.forEach(data => {
                      if (data.events && data.events.length > 0) {
                          allMatches = [...allMatches, ...formatMatches(data.events, data.leagues?.[0]?.name || "Fútbol")];
                      }
                  });
                  const now = new Date();
                  const filteredMatches = allMatches.filter(match => {
                      const hoursDiff = Math.abs(new Date(match.date).getTime() - now.getTime()) / (1000 * 3600);
                      return hoursDiff < 36; 
                  });
                  filteredMatches.sort((a, b) => new Date(a.date) - new Date(b.date));
                  setMatches(filteredMatches);
                } catch (err) {}
                setLoadingSports(false);
              };
              fetchSports();
            }
          }, [viewMode, matches.length]);

          // Notificación de Partidos
          useEffect(() => {
              if (matches.length > 0 && !sportsNotified.current) {
                  const todayMatches = matches.filter(m => {
                      const matchDate = new Date(m.date);
                      const today = new Date();
                      return matchDate.getDate() === today.getDate() && matchDate.getMonth() === today.getMonth();
                  });
                  
                  if (todayMatches.length > 0 && "Notification" in window && Notification.permission === "granted") {
                      new Notification(`¡Hay ${todayMatches.length} partidos hoy!`, {
                          body: `Revisa la sección de Deportes en Pregón 95.7 para ver los resultados y horarios.`,
                          icon: './logo.jpg'
                      });
                  }
                  sportsNotified.current = true;
              }
          }, [matches]);

          // ================== METADATOS MUSICALES ==================
          useEffect(() => {
            if (audioRef.current) audioRef.current.volume = volume;
            const eventSource = new EventSource(zenoMetadataUrl);
            eventSource.onmessage = async (event) => {
              try {
                if (!event.data || typeof event.data !== 'string' || event.data.trim().startsWith('<')) return;
                const data = JSON.parse(event.data);
                if (data && typeof data.streamTitle !== 'undefined') {
                  const streamTitle = data.streamTitle;
                  if (streamTitle === lastRawTitle.current) return;
                  lastRawTitle.current = streamTitle;

                  let title = 'Programación en vivo';
                  let artist = 'PREGÓN 95.7';
                  if (streamTitle && streamTitle.trim() !== '') {
                      const parts = streamTitle.split(' - ');
                      if (parts.length > 1) { artist = parts[0].trim(); title = parts.slice(1).join(' - ').trim(); } 
                      else { title = streamTitle; }
                  }
                  
                  const isGeneric = title.toLowerCase().includes('pregon') || title.toLowerCase().includes('programación') || title.toLowerCase().includes('cuña') || artist.toLowerCase().includes('en vivo');
                  if (isGeneric) setSongInfo({ title: 'Programación en vivo', artist: 'La voz que te acompaña' });
                  else setSongInfo({ title, artist });
                }
              } catch (err) {}
            };
            return () => eventSource.close();
          }, []);

          // ================== CANVAS ONDAS ESTILO NEON/MODERNAS ==================
          const renderWaves = useCallback(() => {
            animationRef.current = requestAnimationFrame(renderWaves);
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const width = rect.width; const height = rect.height;
            ctx.clearRect(0, 0, width, height);
            
            const time = performance.now() / 1000;
            let simulatedBeat = 0;

            if (isPlayingRef.current) {
                simulatedBeat = Math.pow(Math.sin(time * Math.PI * (120 / 60)), 4) * 0.5 + 0.5;
                setBeatScale(1 + simulatedBeat * 0.08);
            } else { setBeatScale(1); }

            // Configuración para ondas modernas
            ctx.globalCompositeOperation = 'screen';
            const numWaves = isPlayingRef.current ? 4 : 2;
            const sliceWidth = width / 100;
            
            const colors = [
                { r: 239, g: 68, b: 68 },  // Rojo vibrante
                { r: 168, g: 85, b: 247 }, // Púrpura
                { r: 59, g: 130, b: 246 }, // Azul celeste
                { r: 236, g: 72, b: 153 }  // Rosa neón
            ];

            for (let j = 0; j < numWaves; j++) {
                ctx.beginPath();
                let x = 0;
                
                // Variación de fase para cada onda
                const phase = time * (1.5 + j * 0.5) + j * Math.PI / 2;
                
                for (let i = 0; i <= 100; i++) {
                    let waveAmplitude = isPlayingRef.current ? 20 + ((Math.sin(i * 0.08 + phase) * 0.5 + 0.5) * simulatedBeat * height * 0.6) : 5;
                    const y = height / 2 + Math.sin(i * 0.05 + phase) * waveAmplitude * (j % 2 === 0 ? 1 : -1);
                    
                    if (i === 0) ctx.moveTo(x, y); 
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }

                const color = colors[j % colors.length];
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
                gradient.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, ${isPlayingRef.current ? 0.8 : 0.3})`);
                gradient.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = isPlayingRef.current ? 3.5 : 2;
                
                // Efecto Neon Glow
                ctx.shadowBlur = isPlayingRef.current ? 15 : 5;
                ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, 1)`;
                
                ctx.stroke();
            }
            // Restaurar configuración
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

          }, []);

          useEffect(() => {
              animationRef.current = requestAnimationFrame(renderWaves);
              return () => cancelAnimationFrame(animationRef.current);
          }, [renderWaves]);

          // ================== AUDIO CONTROLS ==================
          const handlePlayToggle = () => {
            if (isPlaying) {
              audioRef.current.pause(); setIsPlaying(false); isPlayingRef.current = false;
              setStatus('Radio en pausa'); setIsConnecting(false);
            } else {
              setStatus('Conectando...'); setIsConnecting(true);
              audioRef.current.load();
              audioRef.current.play().then(() => {
                    setIsPlaying(true); isPlayingRef.current = true;
                    setIsConnecting(false); setStatus('Al Aire');
              }).catch(() => {
                    setStatus('Error de Conexión'); setIsPlaying(false);
                    isPlayingRef.current = false; setIsConnecting(false);
              });
            }
          };

          const handleVolumeChange = (e) => {
            const val = parseFloat(e.target.value);
            setVolume(val);
            if (audioRef.current) audioRef.current.volume = val;
            if (val > 0 && isMuted) { setIsMuted(false); if (audioRef.current) audioRef.current.muted = false; }
          };

          const toggleMute = () => {
            const newMutedState = !isMuted;
            setIsMuted(newMutedState);
            if (audioRef.current) audioRef.current.muted = newMutedState;
          };

          const handleViewModeChange = (mode) => {
            setViewMode(mode);
            if (mode === 'tv' && isPlaying && audioRef.current) {
               audioRef.current.pause(); setIsPlaying(false); isPlayingRef.current = false;
               setStatus('Radio en pausa'); setIsConnecting(false);
            }
          };

          return (
            <div className="flex flex-col h-[100dvh] w-full bg-zinc-950 font-sans selection:bg-red-500/30">
              
              {/* FONDO DINÁMICO TIPO CUADRÍCULA TECNOLÓGICA */}
              <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden flex flex-col justify-end bg-black">
                  {/* Patrón de Cuadrícula (Grid) Moderno */}
                  <div className="absolute inset-0 opacity-20" style={{ 
                      backgroundImage: 'linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px)', 
                      backgroundSize: '25px 25px', 
                      maskImage: 'radial-gradient(ellipse 80% 80% at 50% 30%, black 10%, transparent 80%)', 
                      WebkitMaskImage: 'radial-gradient(ellipse 80% 80% at 50% 30%, black 10%, transparent 80%)' 
                  }}></div>
                  
                  {/* Orbes de luz (Reactivos al audio) */}
                  <div className="absolute top-[-10%] left-[-20%] w-[80%] h-[80%] rounded-full mix-blend-screen transition-all duration-[2000ms] ease-in-out" style={{ backgroundColor: isPlaying && !isConnecting ? '#3b82f6' : '#27272a', filter: 'blur(140px)', transform: `scale(${isPlaying && !isConnecting ? 1 + (beatScale - 1) * 1.5 : 1})`, opacity: isPlaying && !isConnecting ? Math.min(0.5, 0.2 + (beatScale - 1) * 1.2) : 0.15 }}></div>
                  <div className="absolute bottom-[-10%] right-[-20%] w-[70%] h-[70%] rounded-full mix-blend-screen transition-all duration-[2000ms] ease-in-out" style={{ backgroundColor: isPlaying && !isConnecting ? '#ef4444' : '#18181b', filter: 'blur(160px)', transform: `scale(${isPlaying && !isConnecting ? 1 + (beatScale - 1) * 1.8 : 1})`, opacity: isPlaying && !isConnecting ? Math.min(0.5, 0.2 + (beatScale - 1) * 1.2) : 0.1 }}></div>
                  
                  <div className="absolute inset-0 bg-black/40 backdrop-blur-[20px]"></div>
              </div>

              {/* MODAL AUTH FIREBASE */}
              {showAuthModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                      <div className="w-full max-w-sm bg-zinc-900/90 border border-white/10 p-6 rounded-[32px] shadow-2xl relative animate-[fadeIn_0.3s_ease-out]">
                          <button onClick={() => setShowAuthModal(false)} className="absolute top-5 right-5 text-white/50 hover:text-white transition-colors bg-white/5 p-1 rounded-full"><XIcon size={20} /></button>
                          
                          {user ? (
                              <div className="text-center py-4">
                                  {user.photo ? (
                                      <img src={user.photo} alt="Perfil" className="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-green-500/50 shadow-[0_0_15px_rgba(34,197,94,0.3)] object-cover" />
                                  ) : (
                                      <div className="w-20 h-20 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center border border-green-500/30 mx-auto mb-4"><UserIcon size={32} /></div>
                                  )}
                                  <h3 className="text-2xl font-bold text-white tracking-tight mb-1">¡Hola, {user.name}!</h3>
                                  <p className="text-sm text-white/50 mb-6">{user.email}</p>
                                  <button onClick={handleLogout} className="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-2xl transition-colors">Cerrar Sesión</button>
                              </div>
                          ) : (
                              <>
                                  <h3 className="text-2xl font-bold text-center text-white tracking-tight mb-2 mt-2">{authMode === 'register' ? 'Crear Cuenta' : 'Iniciar Sesión'}</h3>
                                  <p className="text-center text-sm text-white/50 mb-6">{authMode === 'register' ? 'Únete y descubre todas las funciones de la App.' : 'Bienvenido de vuelta a tu radio.'}</p>
                                  
                                  <button onClick={handleGoogleLogin} type="button" className="w-full bg-white hover:bg-gray-100 text-black font-bold py-3 rounded-2xl transition-colors mb-4 flex items-center justify-center gap-3">
                                      <GoogleIcon /> Continuar con Google
                                  </button>

                                  <div className="flex items-center gap-3 mb-4">
                                      <div className="flex-1 h-px bg-white/10"></div>
                                      <span className="text-xs text-white/30 font-medium uppercase tracking-wider">O usa tu correo</span>
                                      <div className="flex-1 h-px bg-white/10"></div>
                                  </div>

                                  <form className="flex flex-col gap-3" onSubmit={handleAuthSubmit}>
                                      {authError && <p className="text-red-400 text-xs text-center font-medium bg-red-500/10 py-2 rounded-lg">{authError}</p>}
                                      {authMode === 'register' && (<input name="name" type="text" placeholder="Tu Nombre" required className="bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-red-500 transition-colors" />)}
                                      <input name="email" type="email" placeholder="Correo electrónico" required className="bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-red-500 transition-colors" />
                                      <input name="password" type="password" placeholder="Contraseña" required minLength="6" className="bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-red-500 transition-colors" />
                                      
                                      {authMode === 'login' && (
                                          <div className="text-right mt-1">
                                              <button type="button" onClick={handlePasswordReset} className="text-[11px] text-white/40 hover:text-white transition-colors">¿Olvidaste tu contraseña?</button>
                                          </div>
                                      )}

                                      <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-2xl transition-colors mt-2 shadow-[0_0_15px_rgba(220,38,38,0.4)]">{authMode === 'register' ? 'Registrarse' : 'Ingresar'}</button>
                                  </form>
                                  <div className="mt-5 text-center">
                                      <button onClick={() => {setAuthMode(authMode === 'register' ? 'login' : 'register'); setAuthError("");}} className="text-sm text-white/50 hover:text-white transition-colors">{authMode === 'register' ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}</button>
                                  </div>
                              </>
                          )}
                      </div>
                  </div>
              )}

              {/* HEADER PRINCIPAL */}
              <main className="flex-1 relative z-10 w-full max-w-md mx-auto flex flex-col pt-safe overflow-hidden">
                  <header className="flex justify-between items-center py-4 px-6 shrink-0 z-20 bg-gradient-to-b from-black/50 to-transparent">
                      <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-full overflow-hidden bg-white shadow-lg shrink-0 border-2 border-white/10">
                              <img src={logoUrl} alt="Logo" className="w-full h-full object-cover" />
                          </div>
                          <div className="flex flex-col">
                              <h1 className="text-lg font-bold tracking-tight text-white/95 leading-tight drop-shadow-md">PREGÓN <span className="text-red-500">95.7</span></h1>
                              <div className="flex items-center gap-2 mt-0.5">
                                  <div className="flex items-center gap-1.5 bg-black/40 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-md">
                                      <span className="relative flex h-1.5 w-1.5"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-green-500"></span></span>
                                      <span className="text-[10px] font-bold tracking-wider text-white/90">{onlineUsers}</span><UsersIcon className="text-white/40" />
                                  </div>
                              </div>
                          </div>
                      </div>
                      <div className="flex items-center gap-2">
                          <button onClick={requestNotificationPermission} className="w-9 h-9 rounded-full flex items-center justify-center border border-white/20 bg-white/10 text-white hover:bg-white/20 transition-colors backdrop-blur-md active:scale-95 shadow-lg">
                              <Bell size={16} />
                          </button>
                          {installPrompt && (
                              <button onClick={handleInstallApp} className="flex items-center gap-1.5 px-3 h-9 rounded-full bg-white text-black font-bold text-xs shadow-lg hover:scale-105 transition-transform active:scale-95">
                                  <DownloadIcon size={14} /> Instalar
                              </button>
                          )}
                          <button onClick={() => setShowAuthModal(true)} className={`w-9 h-9 rounded-full flex items-center justify-center border transition-colors backdrop-blur-md overflow-hidden active:scale-95 ${user ? 'border-white/20' : 'bg-white/10 text-white hover:bg-white/20 border-white/10'}`}>
                              {user && user.photo ? <img src={user.photo} className="w-full h-full object-cover"/> : <UserIcon size={18} />}
                          </button>
                      </div>
                  </header>

                  <div className="flex-1 w-full relative">
                      
                      {/* --- VISTA RADIO CON ASISTENTE IA --- */}
                      <div className={`absolute inset-0 w-full h-full overflow-y-auto custom-scrollbar px-6 pb-6 transition-all duration-300 flex flex-col items-center ${viewMode === 'radio' ? 'opacity-100 translate-y-0 z-10 pointer-events-auto' : 'opacity-0 translate-y-4 pointer-events-none z-0'}`}>
                          <audio ref={audioRef} src={streamUrl} crossOrigin="anonymous" preload="none" />
                          
                          {/* Botón flotante IA "Pregón" */}
                          <div className="w-full flex justify-end shrink-0 z-20 mb-2 relative">
                              <button onClick={() => setShowAIAssistant(true)} className="flex items-center gap-2 bg-gradient-to-r from-purple-600/20 to-blue-600/20 hover:from-purple-600/40 hover:to-blue-600/40 border border-white/20 backdrop-blur-xl px-4 py-2 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all transform hover:scale-105">
                                  <Sparkles size={16} className="text-purple-300 animate-pulse" />
                                  <span className="text-[11px] font-bold text-white tracking-wide">Pregón IA</span>
                              </button>
                          </div>

                          {/* Reproductor Rediseñado */}
                          <div className="w-full mt-2 shrink-0 flex justify-center perspective-1000 transition-transform duration-75 relative" style={{ transform: `scale(${isPlaying && !isConnecting ? beatScale : 1})` }}>
                              
                              {/* Canvas de Ondas Centralizado y Superpuesto */}
                              <canvas ref={canvasRef} className="absolute inset-0 w-full h-[150%] top-1/2 -translate-y-1/2 opacity-100 z-0 pointer-events-none"></canvas>

                              <div className="relative z-10 w-full aspect-square max-w-[240px] rounded-full shadow-[0_20px_50px_rgba(0,0,0,0.8)] flex items-center justify-center backdrop-blur-sm">
                                  <div className={`absolute inset-0 w-full h-full rounded-full overflow-hidden bg-zinc-900 border-4 border-white/10 ${isPlaying && !isConnecting ? 'animate-[spin_6s_linear_infinite]' : ''}`}>
                                      <div className="absolute inset-0 rounded-full border-[12px] border-zinc-950/80 z-10 pointer-events-none"></div>
                                      <div className="absolute inset-0 rounded-full border-[24px] border-zinc-900/40 z-10 pointer-events-none mix-blend-overlay"></div>
                                      <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=800&q=80" alt="Estudio" className={`absolute inset-0 w-full h-full object-cover transition-all duration-1000 ${isPlaying && !isConnecting ? 'opacity-50 scale-110' : 'opacity-20 scale-100 grayscale'}`} />
                                      <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent z-0"></div>
                                      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-[60%] h-[60%] rounded-full overflow-hidden border-2 border-white/30 shadow-[0_0_30px_rgba(0,0,0,1)] bg-black">
                                          <img src={logoUrl} alt="Logo Central" className="w-full h-full object-cover" />
                                      </div>
                                  </div>
                              </div>
                          </div>

                          <div className="flex flex-col items-center text-center w-full mt-8 shrink-0 z-10">
                            <h2 className={`text-2xl font-black tracking-tight text-white w-full truncate ${isConnecting ? 'opacity-50' : 'opacity-100'} drop-shadow-lg`}>{isConnecting ? 'Conectando...' : songInfo.title}</h2>

                          <Trophy size={22} /><span className="text-[9px] font-bold tracking-wide">Deportes</span>
                      </button>
                      <button onClick={() => handleViewModeChange('nasa')} className={`flex flex-col items-center justify-center w-1/4 gap-1.5 transition-all duration-300 ${viewMode === 'nasa' ? 'text-red-400 scale-110' : 'text-white/40 hover:text-white/70'}`}>
                          <MapPin size={22} /><span className="text-[9px] font-bold tracking-wide">Ubicación</span>
                      </button>
                  </div>
              </nav>

              <style dangerouslySetInnerHTML={{__html: `
                .pt-safe { padding-top: env(safe-area-inset-top, 1rem); }
                .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1.5rem); }
                .custom-scrollbar::-webkit-scrollbar { width: 0px; background: transparent; }
                .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
                .perspective-1000 { perspective: 1000px; }
                @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
              `}} />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
